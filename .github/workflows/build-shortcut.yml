name: Build SnapReply template
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build unsigned shortcut
        run: python3 src/build_shortcut.py --output dist/SnapReply-unsigned.shortcut
      - name: Test output and scan for secrets
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/scan_release.py dist/SnapReply-unsigned.shortcut
      - name: Upload unsigned development template
        uses: actions/upload-artifact@v4
        with:
          name: SnapReply-UNSIGNED-source-template
          path: dist/SnapReply-unsigned.shortcut
          if-no-files-found: error
          retention-days: 30
# Apple's shortcuts sign requires a logged-in iCloud account. GitHub-hosted
# macOS runners have no iCloud login and therefore cannot sign this template.
# Run zsh scripts/sign-on-mac.sh on your personal, iCloud-signed-in Mac instead.
